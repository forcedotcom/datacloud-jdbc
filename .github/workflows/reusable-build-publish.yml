name: Reusable Build and Publish

on:
  workflow_call:
    inputs:
      publish:
        required: true
        type: boolean
        description: 'Whether to publish or not'
      version:
        required: false
        type: string
        description: 'Version to publish (tag name or snapshot)'
        default: ''
    secrets:
      CODECOV_TOKEN:
        required: true
      signing_pass:
        required: false
      signing_key:
        required: false
      publish_user:
        required: false
      publish_pass:
        required: false
      signing_pub:
        required: false
      DATACLOUD_USERNAME:
        required: false
      DATACLOUD_PASSWORD:
        required: false
      DATACLOUD_CLIENT_ID:
        required: false
      DATACLOUD_CLIENT_SECRET:
        required: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      hyper_version: ${{ steps.get_version.outputs.hyper_version }}
      resolved_version: ${{ steps.get_version.outputs.resolved_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Get hyperd version and resolved version
        id: get_version
        run: |
          HYPER_VERSION=$(./gradlew -q printHyperApiVersion)
          echo "hyper_version=$HYPER_VERSION" >> $GITHUB_OUTPUT
        env:
          RELEASE_VERSION: ${{ inputs.version }}

  build:
    needs: prepare
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: git fetch --no-tags --depth=1 origin main
      - name: Setup Java with 8 and 17 toolchains
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            8
            17
      - uses: gradle/actions/setup-gradle@v4
        with:
          dependency-graph: generate-and-submit
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"
      - name: Cache hyper artifacts
        uses: actions/cache@v4
        with:
          path: | # include files from downloadHyper and extractHyper tasks, but exclude log files
            .hyper/hyper-*.zip
            .hyperd/hyperd
            .hyperd/hyperd.exe
            .hyperd/*.dll
            .hyperd/*.dylib
            .hyperd/*.so
          key: ${{ runner.os }}-hyper-${{ needs.prepare.outputs.hyper_version }}
          restore-keys: ${{ runner.os }}-hyper-${{ needs.prepare.outputs.hyper_version }}
      - name: Extract Hyper
        id: extract_hyper
        run: ./gradlew extractHyper
      - name: Gradle build (with version)
        id: build-and-test
        run: |
          echo "build and test with version='${{ inputs.version }}'"
          ./gradlew clean build --no-build-cache --rerun-tasks
        env:
          RELEASE_VERSION: ${{ inputs.version }}
      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
      - name: Look at files in verification
        if: ${{ failure() }}
        uses: jaywcjlove/github-action-folder-tree@main
        with:
          path: .
          exclude: ".gradle|build|bin|.git"
          depth: 3
      - name: Upload hyper logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            build/hyperd/*.log
          retention-days: 5

  integration-test:
    needs: [ prepare, build ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build shaded JAR
        run: ./gradlew clean :jdbc:shadowJar
      - name: Run integration test
        run: |
          ./gradlew :integration-test:runIntegrationTest \
            -Dtest.connection.url="jdbc:salesforce-datacloud://login.test2.pc-rnd.salesforce.com" \
            -Dtest.connection.userName="${{ secrets.DATACLOUD_USERNAME }}" \
            -Dtest.connection.password="${{ secrets.DATACLOUD_PASSWORD }}" \
            -Dtest.connection.clientId="${{ secrets.DATACLOUD_CLIENT_ID }}" \
            -Dtest.connection.clientSecret="${{ secrets.DATACLOUD_CLIENT_SECRET }}" \
            --info
      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: |
            integration-test/build/reports/
            jdbc/build/libs/*-shaded.jar

  verify-signing-credentials:
    # Only the mavenCentral (release) deployer signs artifacts; the snapshot deployer
    # runs with sign: false, so skip this check unless a release version is set.
    if: ${{ inputs.publish && inputs.version != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify GPG secret key unlocks with passphrase
        env:
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.signing_key }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.signing_pass }}
        run: |
          set -euo pipefail
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          echo "$JRELEASER_GPG_SECRET_KEY" | gpg --batch --import
          KEY_ID=$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1=="sec"{print $5; exit}')
          if [ -z "$KEY_ID" ]; then
            echo "::error::No secret key found after importing signing_key; the secret may be malformed"
            exit 1
          fi
          if ! echo "signing credential check" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$JRELEASER_GPG_PASSPHRASE" --local-user "$KEY_ID" \
              --detach-sign --output /dev/null; then
            echo "::error::GPG secret key $KEY_ID could not be unlocked with signing_pass (checksum/passphrase mismatch). The Maven Central publish step will fail on this until signing_key/signing_pass are re-synced."
            exit 1
          fi
          echo "GPG secret key $KEY_ID verified: signing_pass unlocks it correctly."

  publish-jreleaser:
    needs: [ prepare, build, integration-test, verify-signing-credentials ]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: git fetch --no-tags --depth=1 origin main
      - name: Setup Java with 8 and 17 toolchains
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            8
            17
      - uses: gradle/actions/setup-gradle@v4
      - name: Double check jars
        run: ./gradlew :verification:check -x :jdbc:test -x :jdbc-core:test -x :jdbc-http:test -x :jdbc-util:test -x :spark-datasource:test --no-build-cache --scan
      - name: Get version for jreleaser
        id: resolve_version
        run: |
          RESOLVED_VERSION=$(./gradlew -q printVersion)
          echo "resolved_version=$RESOLVED_VERSION" >> $GITHUB_OUTPUT
      - name: Publish to Maven Central
        uses: jreleaser/release-action@v2
        env:
          JRELEASER_PROJECT_VERSION: ${{ steps.resolve_version.outputs.resolved_version }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.publish_user }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.publish_pass }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.signing_key }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.signing_pass }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.signing_pub }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_SKIP_TAG: true
      - name: Upload JReleaser logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-logs
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties
          retention-days: 5
